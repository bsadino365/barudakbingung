const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('adm_q',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const qLock=()=>{const q=qget();return q.lock&&q.lock>Date.now()?q.lock:0};
function qFail(){const q=qget();q.f=(q.f||0)+1;if(q.f>=5){q.f=0;q.lv=(q.lv||0)+1;q.lock=Date.now()+Math.min(15*Math.pow(2,q.lv-1),1440)*60000}qset(q);return q}
const qReset=()=>{const q=qget();if(q.f||q.lv||q.lock){q.f=0;q.lv=0;q.lock=0;qset(q)}};
